name: Sync fork
on:
  schedule:
    - cron: '*/5 * * * *'  # cada hora
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git remote add upstream https://github.com/Eduardo0198/Fourware_systems.git
          git fetch upstream
          git merge upstream/main --allow-unrelated-histories
          git push origin main
